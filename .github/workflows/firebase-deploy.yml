name: Deploy Reportes Mensuales 2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Reportes Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/465339579029/locations/global/workloadIdentityPools/github-plcocina/providers/github-actions
          service_account: github-firebase-deploy@plcocina-apps.iam.gserviceaccount.com
          project_id: plcocina-apps
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify federated credentials
        run: |
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth application-default print-access-token >/dev/null

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.1

      - name: Deploy only Reportes Mensuales site
        run: firebase deploy --only hosting:reportes --project plcocina-apps --non-interactive
